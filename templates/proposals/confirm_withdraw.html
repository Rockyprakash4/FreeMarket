{% extends 'base.html' %}

{% block title %}Withdraw Proposal — DevMarket{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm text-center">
        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Withdraw your Proposal?</h1>
        <p class="text-xs text-slate-500 mt-2 leading-relaxed">
            Are you sure you want to withdraw your proposal for <strong>"{{ proposal.project.title }}"</strong>?
        </p>

        <form method="POST" class="mt-6 flex flex-col gap-2">
            {% csrf_token %}
            <button type="submit" class="w-full py-2.5 rounded-xl font-semibold text-sm text-white bg-slate-800 hover:bg-slate-900 transition-colors shadow-sm">
                Yes, Withdraw
            </button>
            <a href="{% url 'marketplace:project_detail' project_id=proposal.project.id %}" class="w-full py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                Keep Proposal Active
            </a>
        </form>
    </div>
</div>
{% endblock %}
